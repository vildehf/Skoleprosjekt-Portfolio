    <div class="hamburger-backdrop" aria-hidden="true"></div>
    <div class="container header-inner">
      <a href="/index.html" class="logo">
        <img src="/src/assets/logo.png" alt="Potepass – trygg hundepass" class="logo-image">
        <span class="logo-text">Potepass</span>
      </a>

      <nav id="primary-nav" class="nav" aria-label="Hovedmeny">
        <ul class="nav-menu">
        <li><a href="/index.html">Hjem</a></li>
          <li><a href="/src/pages/petsitters/petSitters.html">Finn hundepasser</a></li>
          <li><a href="/src/pages/booking/booking.html">Mine bookinger</a></li>
          <li><a href="/src/pages/profile/profile.html">Min profil</a></li>
          <li><a href="/src/pages/registration/registration.html">Mine hunder</a></li>
          <li><a href="/src/pages/contact/contact.html">Kontakt oss</a></li>
        </ul>
      </nav>

      <button class="hamburger" aria-controls="primary-nav" aria-expanded="false" aria-label="Åpne meny">
        <span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </span>
      </button>
    </div>
  </header>
   
    <main class="profile-page">
        <section aria-labelledby="profile-title">
  <h1 id="profile-title">Din profil</h1>

  
  <section aria-labelledby="profile-info-title">
    <h2 id="profile-info-title">Profilinformasjon</h2>

    <form id="profileForm">
      <p>
        <label for="name">Navn</label><br />
        <input
          id="name"
          type="text"
          name="name"
          autocomplete="name"
          value="Mats Sudbø"
        />
      </p>

      <p>
        <label for="email">E-post</label><br />
        <input
          id="email"
          type="email"
          name="email"
          autocomplete="email"
          value="mats@example.com"
        />
      </p>

      <button type="submit">Lagre profil</button>
      <button id="logoutBtn" type="button">
    Logg ut
  </button>
    </form>
  </section>

  <hr />

  
  <section aria-labelledby="contacts-title">
    <h2 id="contacts-title">Ekstra kontaktpunkter</h2>

    <button id="addContactBtn" type="button">+ Legg til kontaktpunkt</button>

    <ul id="contactList" aria-label="Liste over kontaktpunkter"></ul>
  </section>
</section>


<dialog id="contactDialog" aria-labelledby="dialogTitle">
  <form id="contactForm" method="dialog">
    <h3 id="dialogTitle">Kontaktpunkt</h3>

    <input type="hidden" id="editId" />

    <p>
      <label for="type">Kontaktinformasjon</label><br />
      <select id="type" required>
        <option value="phone">Telefon</option>
        <option value="email">Sekundær e-post</option>
        <option value="address">Adresse</option>
        <option value="emergency">Nødkontakt</option>
      </select>
    </p>

    <p>
      <label for="value">Verdi</label><br />
      <input id="value" type="text" required />
    </p>

    <p>
      <label for="label">Notat(valgfritt)</label><br />
      <input id="label" type="text" placeholder="F.eks. Hjem, Jobb, Mamma" />
    </p>

    <menu>
      <button type="submit">Lagre</button>
      <button type="button" id="cancelBtn">Avbryt</button>
    </menu>
  </form>
</dialog>
    </main>
